# Desktop installers, each built on its own OS (as LearnHarness does): the .deb and AppImage on Linux,
# the setup .exe on Windows (with LifeHarness's icon and version info; unsigned, so SmartScreen warns),
# and on macOS a .dmg for Apple silicon and one for Intel (both on GitHub's Apple silicon runner; signed
# ad hoc, so macOS asks for "Open Anyway" once, unless the Apple signing secrets below are set).
#
#   Run by hand:      Actions -> Desktop builds -> Run workflow. The installers are attached to the run.
#   Push a tag:       git tag v0.3.4 && git push origin v0.3.4 (must match package.json's version).
#                     Also creates a DRAFT GitHub Release with the installers, for you to check and publish.
#
# Nothing runs on ordinary pushes. On a private repository this uses the account's included Actions
# compute (GitHub Free: $12 a month; a macOS minute costs about 10 Linux minutes) and its 500 MB of artifact
# storage: the installers are kept for a week (a release keeps its own copies).
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tests and builds never touch real data or credentials: scratch folders in the runner's temp.
      # (A job's env can't use the runner context, so every later step gets them from here.)
      - name: Scratch data folders
        shell: bash
        run: |
          echo "LIFEHARNESS_DATA_DIR=$RUNNER_TEMP/lh-data" >> "$GITHUB_ENV"
          echo "LIFEHARNESS_AUTH_FILE=$RUNNER_TEMP/lh-auth/auth.json" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$version" ] || { echo "tag $GITHUB_REF_NAME doesn't match package.json ($version)"; exit 1; }

      - run: npm ci

      - name: Typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck

      - name: Tests
        run: npm test
        # Windows and macOS run the same tests for information until they've passed there once.
        continue-on-error: ${{ runner.os != 'Linux' }}

      - name: Build the installers
        run: npm run desktop:build
        env:
          # macOS only, all optional. With these repository secrets the app is signed with your Apple
          # Developer ID and notarized by Apple, so it opens without any warning; without them it's signed
          # ad hoc. Unset secrets arrive empty, and desktop-build.mjs ignores empty ones.
          #   MAC_CERTIFICATE            your "Developer ID Application" certificate (.p12), base64-encoded
          #   MAC_CERTIFICATE_PASSWORD   its password
          #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID    for notarization
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: LifeHarness-${{ matrix.name }}
          path: |
            dist-desktop/*.deb
            dist-desktop/*.AppImage
            dist-desktop/*-setup.exe
            dist-desktop/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create a draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --draft --generate-notes --title "LifeHarness ${GITHUB_REF_NAME#v}" --repo "$GITHUB_REPOSITORY"
