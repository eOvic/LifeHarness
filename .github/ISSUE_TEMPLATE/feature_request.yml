name: Feature request
description: An idea that would make LifeHarness more useful to you.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem, in your own words. The "why" matters more than the solution.
      placeholder: When I miss a morning block, I want to…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead (optional)
