appId: dev.lifeharness.desktop
productName: LifeHarness
copyright: Copyright © 2026 eOvic
directories:
  app: desktop-app          # staged by scripts/desktop-build.mjs: main.cjs + preload.cjs, no npm deps
  output: dist-desktop
  buildResources: build
asar: true
# The shell needs no npm packages (only Electron built-ins). electron-builder 26 otherwise falls
# back to the project root and packs the whole web stack into app.asar.
files:
  - "**/*"
  - "!**/node_modules/**"
# The self-contained Next.js server (.next/standalone, with its traced node_modules) is copied to
# resources/server by this hook:
afterPack: scripts/after-pack.cjs
# Installer file names carry no version, so the README can link straight to the latest release's files
# (github.com/eOvic/LifeHarness/releases/latest/download/<file>). The version is in the release itself.
# Windows: a per-user installer (no administrator needed), built on Windows itself (npm run desktop:build).
# Unsigned for now, like LearnHarness's: SmartScreen warns until the installer is code-signed.
win:
  icon: build/icon.png   # 512 px; electron-builder makes the .ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: "${productName}-${arch}-setup.${ext}"   # LifeHarness-x64-setup.exe
nsis:
  oneClick: true
  perMachine: false
# macOS: a disk image per chip, built on a Mac (GitHub's macOS runner: .github/workflows/desktop.yml).
# Without an Apple Developer ID it's signed ad hoc (desktop-build.mjs), and macOS asks once: System Settings
# → Privacy & Security → Open Anyway. With a Developer ID certificate (CSC_LINK) and Apple's notary
# credentials (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) it's signed and notarized: no warning.
# Hardened runtime is on (electron-builder's default), with its default Electron entitlements.
mac:
  icon: build/icon-mac.png   # 1024 px on Apple's icon grid (scripts/mac-icons.ts); electron-builder makes the .icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]     # arm64: Apple silicon (M1 and later); x64: Intel
  artifactName: "${productName}-${arch}.${ext}"   # LifeHarness-arm64.dmg, LifeHarness-x64.dmg
  minimumSystemVersion: "13.0"   # Electron 44+ needs macOS 13 (Ventura)
  # The server's fonts, images and WebAssembly are sealed by the app's signature like any resource; only
  # code (.node add-ons) is signed file by file.
  signIgnore:
    - "/Contents/Resources/server/.+\\.(woff2?|ttf|otf|eot|png|jpe?g|gif|ico|webp|avif|svg|wasm|so|br|gz|map)$"
linux:
  target: [deb, AppImage]
  category: Office
  executableName: lifeharness
  icon: build/icons
  synopsis: From what you want in life to a week you can actually live.
  description: An AI coach that interviews you about your goals and constraints, plans your week around them, and keeps it honest with tracking and weekly reviews.
  syncDesktopName: true
deb:
  artifactName: "${name}_${arch}.${ext}"   # lifeharness_amd64.deb
appImage:
  artifactName: "${productName}-${arch}.${ext}"   # LifeHarness-x86_64.AppImage
